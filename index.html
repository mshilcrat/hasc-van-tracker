<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3fafb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1d21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Van Tracker">
<meta name="format-detection" content="telephone=no">
<title>HASC Van Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#f3fafb;--card:#ffffff;--ink:#10333a;--muted:#55707a;--line:#d3e7ea;
  --brand:#37c1cf;--deep:#0b6f7a;--deepShadow:rgba(11,111,122,.28);--tint:#e2f5f7;
  --yellow:#f5cf01;--yellowInk:#2b2500;--yellowTint:#fff6c7;--yellowDeep:#6b5900;--yellowShadow:rgba(170,140,0,.28);
  --focus:#0b6f7a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1d21;--card:#132a30;--ink:#e7f4f6;--muted:#a3bcc2;--line:#24434a;
    --tint:#173b42;--yellowTint:#3a3410;--yellowDeep:#f5dc5a;--focus:#7fe0ea;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1d21;--card:#132a30;--ink:#e7f4f6;--muted:#a3bcc2;--line:#24434a;
  --tint:#173b42;--yellowTint:#3a3410;--yellowDeep:#f5dc5a;--focus:#7fe0ea;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:clamp(12px,2.4vh,20px) max(16px,env(safe-area-inset-right,0px)) clamp(14px,2.6vh,24px) max(16px,env(safe-area-inset-left,0px));gap:clamp(12px,2.2vh,20px)}
.grow{flex:1}
.push{margin-top:auto}

/* brand */
.brandrow{display:flex;align-items:center;gap:12px}
.logo{height:40px;width:auto;flex:none;display:block}
.bdiv{width:2px;height:30px;background:var(--brand);border-radius:2px;flex:none}
.appname{font-size:19px;font-weight:800;letter-spacing:-.01em}

/* home */
.where{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.where .w1{font-size:18px;font-weight:800}
.where .w2{font-size:15px;color:var(--muted);margin-top:3px;font-weight:600}
.btn-out{min-height:52px;padding:0 18px;border:2px solid var(--line);border-radius:16px;font-size:16px;font-weight:700;background:var(--card);flex:none}
.today{font-size:clamp(25px,4vh,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:6px 2px 0}
.task{width:100%;min-height:clamp(110px,16vh,150px);background:var(--card);border:2px solid var(--line);border-radius:26px;padding:20px;display:flex;align-items:center;gap:18px;text-align:left;box-shadow:0 10px 26px rgba(16,51,58,.07)}
.task .ic{width:72px;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
.task .ic.y{background:var(--yellow);color:var(--yellowInk)}
.task .ic.t{background:var(--brand);color:#06363c}
.task .tt{font-size:23px;font-weight:800;line-height:1.2}
.task .ts{font-size:16px;font-weight:700;color:var(--muted);margin-top:6px}
.task .ts.ok{color:var(--deep)}
.task .chev{margin-left:auto;color:var(--muted);flex:none}
.btn-soft{width:100%;min-height:64px;border-radius:20px;background:var(--tint);color:var(--deep);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}

/* flow */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{min-height:56px;padding:0 20px 0 14px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-size:18px;font-weight:800;display:flex;align-items:center;gap:6px}
.count{font-size:20px;font-weight:800;color:var(--muted)}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.dot.p{background:var(--deep);border-color:var(--deep)}
.dot.m{background:var(--yellow);border-color:var(--yellow)}
.dot.cur{box-shadow:0 0 0 4px var(--brand)}
.who{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(8px,1.6vh,16px);padding:4px 0}
.avatar{width:clamp(88px,17vh,150px);height:clamp(88px,17vh,150px);border-radius:50%;background:var(--tint);color:var(--deep);display:flex;align-items:center;justify-content:center;font-size:clamp(32px,6vh,54px);font-weight:800;border:6px solid var(--card);box-shadow:0 0 0 3px var(--brand)}
.pname{font-size:clamp(28px,4.8vh,42px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.q{font-size:clamp(18px,2.7vh,23px);font-weight:600;color:var(--muted);line-height:1.35;max-width:22ch}
.now{font-size:16px;font-weight:700;padding:8px 14px;border-radius:99px;background:var(--tint);color:var(--deep)}
.acts{display:flex;flex-direction:column;gap:14px}
.big{width:100%;min-height:clamp(80px,11vh,110px);border-radius:26px;font-size:clamp(20px,2.9vh,25px);font-weight:800;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 18px;line-height:1.2;text-align:center}
.big .bi{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.yes{background:var(--deep);color:#fff;box-shadow:0 10px 24px var(--deepShadow)}
.yes .bi{background:rgba(255,255,255,.18)}
.no{background:var(--yellow);color:var(--yellowInk);box-shadow:0 10px 24px var(--yellowShadow)}
.no .bi{background:rgba(43,37,0,.12)}
.later{background:var(--card);color:var(--ink);border:2px solid var(--line);min-height:76px;font-size:20px}
.big:active,.task:active,.opt:active,.rs:active{transform:scale(.98)}
.reasons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rs{min-height:clamp(92px,13vh,130px);border-radius:24px;background:var(--card);border:2px solid var(--line);font-size:21px;font-weight:800;padding:10px;line-height:1.2}
.wq{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.02em;line-height:1.2}

/* done */
.badge{width:104px;height:104px;border-radius:50%;background:var(--brand);color:#06363c;display:flex;align-items:center;justify-content:center;margin:6px auto 0}
.dt{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border-radius:22px;padding:16px;text-align:center}
.tile .n{font-size:44px;font-weight:800;line-height:1}
.tile .l{font-size:16px;font-weight:700;margin-top:6px}
.tile.t{background:var(--tint);color:var(--deep)}
.tile.y{background:var(--yellowTint);color:var(--yellowDeep)}
.tasks{display:flex;flex-direction:column;gap:inherit}
.hint{font-size:16px;font-weight:700;color:var(--muted);text-align:center}
.people{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.prow{width:100%;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);text-align:left;font-size:18px;font-weight:800}
.prow:last-child{border-bottom:0}
.chip{padding:7px 12px;border-radius:99px;font-size:14px;font-weight:800;flex:none}
.chip.t{background:var(--tint);color:var(--deep)}
.chip.y{background:var(--yellowTint);color:var(--yellowDeep)}
.chip.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.empty{padding:22px;text-align:center;font-size:18px;font-weight:700;color:var(--muted)}

/* setup */
.h2{font-size:30px;font-weight:800;letter-spacing:-.02em}
.lbl{font-size:17px;font-weight:800;margin:4px 2px 8px;display:block}
.inp{width:100%;min-height:64px;border:2px solid var(--line);border-radius:18px;padding:0 18px;font-size:21px;font-weight:700;background:var(--card)}
.inp.err{border-color:#c0392b}
.err-msg{color:#c0392b;font-weight:700;font-size:16px;margin:8px 2px 0}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{min-height:64px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:8px}
.opts.row .opt{justify-content:center;padding:0 8px}
.opt.on{border-color:var(--deep);background:var(--tint);color:var(--deep)}

/* sheet */
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.info{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.info .k{font-size:13px;font-weight:700;color:var(--muted)}
.info .v{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.banner{border-radius:16px;padding:14px 16px;font-size:16px;font-weight:800}
.banner.p{background:var(--yellowTint);color:var(--yellowDeep)}
.banner.c{background:var(--tint);color:var(--deep)}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tr{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.tr:last-child{border-bottom:0}
.tr.th{font-size:13px;font-weight:800;color:var(--muted);background:var(--bg)}
.tr .n{font-weight:800}
.tr .s{font-weight:800}
.tr .s.t{color:var(--deep)}
.tr .s.y{color:var(--yellowDeep)}
.tr .s.m{color:var(--muted)}
.tr .tm{font-size:12px;color:var(--muted);font-weight:600}
.sig{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;font-size:15px;font-weight:700;color:var(--muted)}
.sigline{border-bottom:2px solid var(--line);height:34px}
.scr{display:flex;flex-direction:column;gap:inherit}
.psheet{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #37c1cf;padding-bottom:10px;margin-bottom:14px}
.ph .logo{height:44px}
.ph .appname{font-size:20pt;color:#000}
.pdate{font-size:12pt;font-weight:700}
.pinfo{width:100%;border-collapse:collapse;margin-bottom:16px}
.pinfo th{text-align:left;font-weight:700;color:#444;padding:5px 12px 5px 0;white-space:nowrap;width:1%}
.pinfo td{font-weight:800;padding:5px 12px 5px 0}
.ptbl{width:100%;border-collapse:collapse}
.ptbl th{background:#e2f5f7!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:left;font-size:11pt;padding:8px;border:1px solid #888}
.ptbl td{padding:9px 8px;border:1px solid #888;font-size:12pt}
.ptbl tr{break-inside:avoid}
.psig{display:grid;grid-template-columns:2.4fr 1fr;column-gap:28px;row-gap:26px;margin-top:40px;font-size:11pt;color:#333;break-inside:avoid}
.psig .sl{border-bottom:1.5px solid #000;height:30px;margin-bottom:4px}
.pvbar{display:none}
body.pv-open .scr{display:none}
body.pv-open .pvbar{display:flex;flex-direction:column;gap:12px;background:var(--yellowTint);color:var(--yellowDeep);border-radius:18px;padding:16px;font-size:17px;font-weight:700;line-height:1.4}
body.pv-open .psheet{display:block;background:#fff;color:#000;border-radius:14px;padding:20px;overflow-x:auto;font-size:12pt;box-shadow:0 6px 20px rgba(0,0,0,.08)}
body.pv-open .psheet>*{min-width:600px}

@media (orientation: landscape) and (max-height: 560px){
  .app{max-width:900px}
  .app.flow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:28px;align-items:start}
  .app.flow>.bar{grid-column:1 / -1}
  .app.flow>.dots{grid-column:1}
  .app.flow>.who{grid-column:1;grid-row:3;align-self:center}
  .app.flow>.acts{grid-column:2;grid-row:2 / 4;align-self:center}
  .app.flow>.wq{grid-column:1;grid-row:2 / 4;align-self:center}
  .app.flow>.reasons{grid-column:2;grid-row:2 / 4;align-self:center}
  .avatar{width:76px;height:76px;font-size:28px;border-width:4px}
  .pname{font-size:28px}
  .q{font-size:18px}
  .big{min-height:84px;font-size:21px}
  .rs{min-height:84px}
  .tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .task{min-height:120px}
}
@page{size:letter;margin:0.6in}
@media print{
  :root{padding:0}
  html,body{background:#fff!important;color:#000;height:auto}
  .scr,.noprint{display:none!important}
  .app{max-width:none;padding:0;display:block;min-height:0}
  .psheet{display:block!important;color:#000;font-size:12pt;padding:0!important;box-shadow:none!important;border-radius:0!important}
  .pvbar{display:none!important}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.big:active,.task:active,.opt:active,.rs:active{transform:none}}
</style>
</head>

function detectLang(){
  const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
  for(const l of list){const p=String(l||'').toLowerCase().split('-')[0];if(I18N[p])return p;}
  return 'en';
}
const LANG=detectLang();document.documentElement.lang=LANG;
function t(k,v){let s=I18N[LANG][k]!==undefined?I18N[LANG][k]:I18N.en[k];if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const LOCATIONS=['East 14th Day Hab','East 35th Day Hab','NYA Day Hab'];
const VANS=['VAN-12','VAN-07','VAN-21'];
const REASONS=['absent','refused','notReady','other'];
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}

const now=new Date();
const dayKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
const dateLong=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const dateShort=now.toLocaleDateString(undefined,{month:'2-digit',day:'2-digit',year:'numeric'});
const clock=()=>new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});

let settings=load('vt:settings')||{loc:LOCATIONS[0],van:VANS[0],staff:''};
if(LOCATIONS.indexOf(settings.loc)<0)settings.loc=LOCATIONS[0];
if(VANS.indexOf(settings.van)<0)settings.van=VANS[0];

// Demo roster is generated at runtime. No individual names are stored in this file.
function loadRoster(){return Array.from({length:8},(_,i)=>({id:'demo-'+(i+1),num:String(i+1).padStart(2,'0'),pickup:null,reason:null,pickupTime:null,dropoff:false,dropoffTime:null}));}
const sessKey=()=>'vt:'+dayKey+':'+settings.loc+':'+settings.van;
let sess;
function openSession(){sess=load(sessKey());if(!sess||!Array.isArray(sess.people))sess={people:loadRoster()};}
function save(){store(sessKey(),sess);}
openSession();

let screen=settings.staff?'home':'setup';
let cur=null;               // current person id in a flow
let draft=null;             // setup draft
let setupErr=false;
let pvOpen=false;

const P=()=>sess.people;
const find=id=>P().find(p=>p.id===id);
const pname=p=>esc(t('individual'))+' '+p.num;
const onVan=()=>P().filter(p=>p.pickup==='picked');
const puPending=()=>P().filter(p=>!p.pickup);
const doPending=()=>onVan().filter(p=>!p.dropoff);

function backBtn(act){return '<button class="back noprint" data-act="'+act+'">'+I.back+esc(t('back'))+'</button>';}
function dotsHTML(list,curId,dropMode){
  return '<div class="dots" aria-hidden="true">'+list.map(p=>{
    let c='dot';
    if(dropMode){if(p.dropoff)c+=' p';}else{if(p.pickup==='picked')c+=' p';else if(p.pickup==='missed')c+=' m';}
    if(p.id===curId)c+=' cur';
    return '<span class="'+c+'"></span>';
  }).join('')+'</div>';
}
function statusText(p){if(p.pickup==='picked')return t('pickedUp');if(p.pickup==='missed')return t('missed')+' · '+t(p.reason);return '';}

  return '<div class="brandrow">'+LOGO+'<div class="appname">'+esc(t('appName'))+'</div></div>'+
    '<div class="where"><div><div class="w1">'+esc(settings.loc)+'</div><div class="w2">'+esc(settings.van)+' · '+esc(t('recordedBy'))+' '+esc(settings.staff)+'</div></div>'+
    '<button class="btn-out" data-act="setup">'+esc(t('change'))+'</button></div>'+
    '<div class="today">'+esc(dateLong)+'</div>'+
    '<div class="tasks"><button class="task" data-act="startPU"><div class="ic y">'+I.sun+'</div><div><div class="tt">'+esc(t('pickup'))+'</div>'+puStatus+'</div><div class="chev">'+I.chev+'</div></button>'+
    '<button class="task" data-act="startDO"><div class="ic t">'+I.home+'</div><div><div class="tt">'+esc(t('dropoff'))+'</div>'+doStatus+'</div><div class="chev">'+I.chev+'</div></button></div>'+
    '<button class="btn-soft push" data-act="sheet">'+I.sheet+esc(t('sheetBtn'))+'</button>';
}
function puHTML(){
  const p=find(cur),list=P(),i=list.indexOf(p)+1;
  return '<div class="bar">'+backBtn('home')+'<div class="count">'+esc(t('ofN',{i:i,n:list.length}))+'</div></div>'+
    dotsHTML(list,p.id,false)+
    '<div class="who grow"><div class="pname">'+pname(p)+'</div>'+
    (p.pickup?'<div class="now">'+esc(t('current',{s:statusText(p)}))+'</div>':'')+
    '<div class="q">'+esc(t('qPick'))+'</div></div>'+
    '<div class="acts"><button class="big yes" data-act="pick"><span class="bi">'+I.check+'</span>'+esc(t('yesVan'))+'</button>'+
    '<button class="big no" data-act="miss"><span class="bi">'+I.x+'</span>'+esc(t('noVan'))+'</button></div>';
}
function reasonHTML(){
  const p=find(cur);
  return '<div class="bar">'+backBtn('toPU')+'<div class="count">'+pname(p)+'</div></div>'+
    '<div class="wq grow" style="display:flex;align-items:center;justify-content:center">'+esc(t('qWhy'))+'</div>'+
    '<div class="reasons">'+REASONS.map(r=>'<button class="rs" data-act="reason" data-r="'+r+'">'+esc(t(r))+'</button>').join('')+'</div>';
}
function puDoneHTML(){
  const picked=onVan().length,missed=P().filter(p=>p.pickup==='missed').length;
  return '<div class="badge">'+I.bigcheck+'</div><div class="dt">'+esc(t('puFinished'))+'</div>'+
    '<div class="tiles"><div class="tile t"><div class="n">'+picked+'</div><div class="l">'+esc(t('lblOnVan'))+'</div></div>'+
    '<div class="tile y"><div class="n">'+missed+'</div><div class="l">'+esc(t('lblNotComing'))+'</div></div></div>'+
    '<div class="hint">'+esc(t('tapToChange'))+'</div>'+
    '<div class="people">'+P().map(p=>{
      const c=p.pickup==='picked'?'<span class="chip t">'+esc(t('pickedUp'))+'</span>':'<span class="chip y">'+esc(t('missed'))+'</span>';
      return '<button class="prow" data-act="editPU" data-id="'+p.id+'"><span>'+pname(p)+'</span>'+c+'</button>';
    }).join('')+'</div>'+
    '<button class="big yes push" data-act="sheet">'+esc(t('sheetBtn'))+'</button>'+
    '<button class="big later" data-act="home">'+esc(t('home'))+'</button>';
}
function doHTML(){
  const list=onVan(),p=find(cur),i=list.indexOf(p)+1;
  return '<div class="bar">'+backBtn('home')+'<div class="count">'+esc(t('ofN',{i:i,n:list.length}))+'</div></div>'+
    dotsHTML(list,p.id,true)+
    '<div class="who grow"><div class="pname">'+pname(p)+'</div>'+
    (p.dropoff?'<div class="now">'+esc(t('current',{s:t('droppedOff')}))+'</div>':'')+
    '<div class="q">'+esc(t('qDrop'))+'</div></div>'+
    '<div class="acts"><button class="big yes" data-act="drop"><span class="bi">'+I.check+'</span>'+esc(t('yesDrop'))+'</button>'+
    '<button class="big later" data-act="notYet">'+esc(t('notYet'))+'</button></div>';
}
function doDoneHTML(){
  const list=onVan();
  if(!list.length)return '<div class="bar">'+backBtn('home')+'<div></div></div><div class="people grow" style="display:flex;align-items:center;justify-content:center"><div class="empty">'+esc(t('noneOnVan'))+'</div></div><button class="big yes push" data-act="home">'+esc(t('home'))+'</button>';
  const dropped=list.filter(p=>p.dropoff).length,waiting=list.length-dropped;
  return '<div class="badge">'+I.bigcheck+'</div><div class="dt">'+esc(t('doFinished'))+'</div>'+
    '<div class="tiles"><div class="tile t"><div class="n">'+dropped+'</div><div class="l">'+esc(t('lblDropped'))+'</div></div>'+
    '<div class="tile y"><div class="n">'+waiting+'</div><div class="l">'+esc(t('lblWaiting'))+'</div></div></div>'+
    '<div class="hint">'+esc(t('tapToChange'))+'</div>'+
    '<div class="people">'+list.map(p=>{
      const c=p.dropoff?'<span class="chip t">'+esc(t('droppedOff'))+'</span>':'<span class="chip y">'+esc(t('waiting'))+'</span>';
      return '<button class="prow" data-act="editDO" data-id="'+p.id+'"><span>'+pname(p)+'</span>'+c+'</button>';
    }).join('')+'</div>'+
    '<button class="big yes" data-act="sheet">'+esc(t('sheetBtn'))+'</button>'+
    '<button class="big later" data-act="home">'+esc(t('home'))+'</button>';
}
function setupHTML(){
  const d=draft;
  const canBack=!!settings.staff;
  return (canBack?'<div class="bar">'+backBtn('home')+'<div></div></div>':'')+
    '<div class="brandrow">'+LOGO+'<div class="appname">'+esc(t('appName'))+'</div></div>'+
    '<div class="h2">'+esc(t('setupTitle'))+'</div>'+
    '<div><label class="lbl" for="fStaff">'+esc(t('whoAreYou'))+'</label><input id="fStaff" class="inp'+(setupErr?' err':'')+'" autocomplete="name" placeholder="'+esc(t('namePh'))+'" value="'+esc(d.staff)+'">'+
    (setupErr?'<div class="err-msg">'+esc(t('nameNeeded'))+'</div>':'')+'</div>'+
    '<div><div class="lbl">'+esc(t('location'))+'</div><div class="opts">'+LOCATIONS.map(l=>'<button class="opt'+(l===d.loc?' on':'')+'" data-act="pickLoc" data-v="'+esc(l)+'" aria-pressed="'+(l===d.loc)+'"><span>'+esc(l)+'</span>'+(l===d.loc?I.check:'')+'</button>').join('')+'</div></div>'+
    '<div><div class="lbl">'+esc(t('vehicle'))+'</div><div class="opts row">'+VANS.map(v=>'<button class="opt'+(v===d.van?' on':'')+'" data-act="pickVan" data-v="'+esc(v)+'" aria-pressed="'+(v===d.van)+'">'+esc(v)+'</button>').join('')+'</div></div>'+
    '<button class="big yes push" data-act="saveSetup">'+esc(t('save'))+'</button>';
}
function sheetHTML(){
  const n=P().length,pending=puPending().length,dp=doPending().length;
  let banner;
  if(pending)banner='<div class="banner p">'+esc(t('inProgPU',{n:pending,total:n}))+'</div>';
  else if(dp)banner='<div class="banner p">'+esc(t('inProgDO',{n:dp}))+'</div>';
  else banner='<div class="banner c">'+esc(t('complete'))+'</div>';
  const rows=P().map(p=>{
    let pu,dr,drT='';
    if(p.pickup==='picked')pu='<div class="s t">'+esc(t('pickedUp'))+'</div>';
    else if(p.pickup==='missed')pu='<div class="s y">'+esc(t('missed'))+' · '+esc(t(p.reason))+'</div>';
    else pu='<div class="s y">'+esc(t('notRecorded'))+'</div>';
    if(p.pickup==='missed')dr='<div class="s m">'+esc(t('na'))+'</div>';
    else if(p.dropoff){dr='<div class="s t">'+esc(t('droppedOff'))+'</div>';drT=p.dropoffTime;}
    else dr='<div class="s m">—</div>';
    return '<div class="tr"><div class="n">'+pname(p)+'</div><div>'+pu+'<div class="tm">'+esc(p.pickupTime||'')+'</div></div><div>'+dr+'<div class="tm">'+esc(drT)+'</div></div></div>';
  }).join('');
  const prow=P().map(p=>{
    let pu,dr,drT='';
    if(p.pickup==='picked')pu=t('pickedUp');else if(p.pickup==='missed')pu=t('missed')+' · '+t(p.reason);else pu=t('notRecorded');
    if(p.pickup==='missed')dr=t('na');else if(p.dropoff){dr=t('droppedOff');drT=p.dropoffTime;}else dr='—';
    return '<tr><td><b>'+pname(p)+'</b></td><td>'+esc(pu)+'</td><td>'+esc(p.pickupTime||'—')+'</td><td>'+esc(dr)+'</td><td>'+esc(drT||'—')+'</td></tr>';
  }).join('');
  const statusTxt=pending?t('inProgPU',{n:pending,total:n}):(dp?t('inProgDO',{n:dp}):t('complete'));
  const psheet='<div class="psheet"><div class="ph"><div class="brandrow">'+LOGO+'<div class="appname">'+esc(t('dailySheet'))+'</div></div><div class="pdate">'+esc(dateLong)+'</div></div>'+
    '<table class="pinfo"><tr><th>'+esc(t('location'))+'</th><td>'+esc(settings.loc)+'</td><th>'+esc(t('vehicle'))+'</th><td>'+esc(settings.van)+'</td></tr>'+
    '<tr><th>'+esc(t('date'))+'</th><td>'+esc(dateShort)+'</td><th>'+esc(t('recordedBy'))+'</th><td>'+esc(settings.staff||'—')+'</td></tr>'+
    '<tr><th>'+esc(t('status'))+'</th><td colspan="3">'+esc(statusTxt)+'</td></tr></table>'+
    '<table class="ptbl"><thead><tr><th>'+esc(t('individual'))+'</th><th>'+esc(t('pickupCol'))+'</th><th>'+esc(t('time'))+'</th><th>'+esc(t('dropoffCol'))+'</th><th>'+esc(t('time'))+'</th></tr></thead><tbody>'+prow+'</tbody></table>'+
    '<div class="psig"><div><div class="sl"></div>'+esc(t('staffSig'))+'</div><div><div class="sl"></div>'+esc(t('date'))+'</div>'+
    '<div><div class="sl"></div>'+esc(t('managerSig'))+'</div><div><div class="sl"></div>'+esc(t('date'))+'</div></div></div>';
  const pvbar='<div class="pvbar"><div>'+esc(t('pvMsg'))+'</div><button class="btn-out" data-act="pvClose" style="align-self:flex-start">'+esc(t('close'))+'</button></div>';
  return pvbar+psheet+'<div class="scr"><div class="sheet-h">'+backBtn('home')+'<div></div></div>'+
    '<div class="h2">'+esc(t('dailySheet'))+'</div>'+
    '<div class="info"><div><div class="k">'+esc(t('location'))+'</div><div class="v">'+esc(settings.loc)+'</div></div>'+
    '<div><div class="k">'+esc(t('vehicle'))+'</div><div class="v">'+esc(settings.van)+'</div></div>'+
    '<div><div class="k">'+esc(t('date'))+'</div><div class="v">'+esc(dateShort)+'</div></div>'+
    '<div><div class="k">'+esc(t('recordedBy'))+'</div><div class="v">'+esc(settings.staff||'—')+'</div></div></div>'+
    banner+
    '<div class="tbl"><div class="tr th"><div>'+esc(t('individual'))+'</div><div>'+esc(t('pickupCol'))+'</div><div>'+esc(t('dropoffCol'))+'</div></div>'+rows+'</div>'+
    '<div class="sig">'+esc(t('managerSig'))+'<div class="sigline"></div></div>'+
    '<button class="big yes noprint" data-act="print"><span class="bi">'+I.printer+'</span>'+esc(t('printBtn'))+'</button></div>';
}

const app=document.getElementById('app');
function render(){
  const map={home:homeHTML,setup:setupHTML,pu:puHTML,reason:reasonHTML,puDone:puDoneHTML,do:doHTML,doDone:doDoneHTML,sheet:sheetHTML};
  if(screen==='setup'&&!draft)draft={loc:settings.loc,van:settings.van,staff:settings.staff};
  app.className='app'+((screen==='pu'||screen==='do'||screen==='reason')?' flow':'');
  if(screen!=='sheet')pvOpen=false;
  document.body.classList.toggle('pv-open',screen==='sheet'&&pvOpen);
  app.innerHTML=map[screen]();
  window.scrollTo(0,0);
}
function go(s,id){screen=s;if(id!==undefined)cur=id;render();}

/* next person after `id` in `list`, wrapping; null if none */
function nextAfter(list,id){
  if(!list.length)return null;
  const all=P(),idx=all.findIndex(p=>p.id===id);
  for(let k=1;k<=all.length;k++){const q=all[(idx+k)%all.length];if(list.indexOf(q)>=0)return q;}
  return null;
}
function afterPU(){const n=nextAfter(puPending(),cur);if(n)go('pu',n.id);else go('puDone');}

app.addEventListener('input',e=>{if(e.target.id==='fStaff'&&draft){draft.staff=e.target.value;}});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  switch(a){
    case 'home':go('home');break;
    case 'setup':draft=null;setupErr=false;go('setup');break;
    case 'pickLoc':draft.loc=b.dataset.v;render();break;
    case 'pickVan':draft.van=b.dataset.v;render();break;
    case 'saveSetup':{
      const name=(draft.staff||'').trim();
      if(!name){setupErr=true;render();const f=document.getElementById('fStaff');if(f)f.focus();break;}
      settings={loc:draft.loc,van:draft.van,staff:name};store('vt:settings',settings);
      draft=null;setupErr=false;openSession();go('home');break;
    }
    case 'startPU':{const q=puPending()[0];if(q)go('pu',q.id);else go('puDone');break;}
    case 'pick':{const p=find(cur);p.pickup='picked';p.reason=null;p.pickupTime=clock();save();afterPU();break;}
    case 'miss':go('reason');break;
    case 'toPU':go('pu');break;
    case 'reason':{const p=find(cur);p.pickup='missed';p.reason=b.dataset.r;p.pickupTime=clock();p.dropoff=false;p.dropoffTime=null;save();afterPU();break;}
    case 'editPU':go('pu',b.dataset.id);break;
    case 'startDO':{if(!onVan().length){go('doDone');break;}const q=doPending()[0];if(q)go('do',q.id);else go('doDone');break;}
    case 'drop':{const p=find(cur);p.dropoff=true;p.dropoffTime=clock();save();const n=nextAfter(doPending(),cur);if(n)go('do',n.id);else go('doDone');break;}
    case 'notYet':{const p=find(cur);p.dropoff=false;p.dropoffTime=null;save();const others=doPending().filter(q=>q.id!==cur);const n=nextAfter(others,cur);if(n)go('do',n.id);else go('doDone');break;}
    case 'editDO':go('do',b.dataset.id);break;
    case 'sheet':go('sheet');break;
    case 'print':{
      let fired=false;const on=()=>{fired=true;};
      window.addEventListener('beforeprint',on);
      try{window.print();}catch(err){}
      setTimeout(()=>{window.removeEventListener('beforeprint',on);if(!fired){pvOpen=true;render();}},700);
      return;
    }
    case 'pvClose':pvOpen=false;render();break;
  }
});
render();
</script>
</body>
